[project]
name = "pingme-ntfy"
version = "0.1.0"
description = "Send a push notification to your phone with a single ping() call, using ntfy."
readme = "README.md"
license = "EUPL-1.2"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []
authors = [{ name = "Javier Sempere" }]
keywords = ["ntfy", "notification", "push", "phone"]

[project.urls]
Homepage = "https://github.com/JSempereH/pingme-ntfy"

[project.scripts]
pingme-ntfy = "pingme_ntfy:main"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
